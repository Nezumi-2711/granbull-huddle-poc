# Production LiveKit config for the POC (single node).
# API keys come from the LIVEKIT_KEYS env var ("<key>: <secret>"), not from this file.
port: 7880
bind_addresses:
  - 0.0.0.0
log_level: info
rtc:
  tcp_port: 7881          # ICE/TCP fallback when UDP is blocked
  udp_port: 7882          # single UDP port (mux) — easy to open in a firewall
  use_external_ip: true   # discover the public IP via STUN and advertise it in ICE
room:
  empty_timeout: 300      # seconds before an empty room is closed
  max_participants: 50    # POC guard-rail, raise for load tests
# TURN/TLS on 443 is out of POC scope (Traefik already owns 443). See README.
